[platformio]
default_envs = inkplate2

[inkplate_defaults]
; default environment for the Inkplate 2
platform = espressif32 @ 6.11.0
framework = arduino
monitor_speed = 115200
board = esp32dev
; CPU Frequency. Max for ESP32: 240000000L
board_build.f_cpu = 240000000L
; no OTA needed on this device, use the whole flash for the app
board_build.partitions = huge_app.csv

; The Inkplate library prioritizes ARDUINO_ESP32_DEV (thinking it is an
; Inkplate 6 for BC reasons), so make sure it is not set.
build_unflags =
  -DARDUINO_ESP32_DEV

lib_deps =
  https://github.com/SolderedElectronics/Inkplate-Arduino-library#10.2.1
  bblanchon/ArduinoJson @ 7.1.0 ; for parsing the 7Timer forecast JSON

; set the default target to compile, upload, and monitor
targets = upload, monitor
monitor_filters = time, esp32_exception_decoder, default

build_flags =
  -DARDUINO_INKPLATE2
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
    ; the Inkplate 2 has an ESP32-WROVER with 8MB PSRAM, and the Inkplate
    ; library allocates its framebuffer there (ps_malloc returns NULL and
    ; display.begin() fails without these flags)
  -DCONFIG_FREERTOS_CHECK_STACKOVERFLOW_PTRVAL
    ; sets configCHECK_FOR_STACK_OVERFLOW = 1, helps detect stack overflows
  -Wall
  -Wextra
  -Wno-unused-parameter
    ; enable compiler warnings to catch common issues at build time

[env:inkplate2]
extends = inkplate_defaults

[env:debug]
extends = inkplate_defaults
build_type = debug
build_flags =
  ${inkplate_defaults.build_flags}
  -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG
    ; debug levels
    ; ARDUHAL_LOG_LEVEL_NONE
    ; ARDUHAL_LOG_LEVEL_ERROR
    ; ARDUHAL_LOG_LEVEL_WARN  *default*
    ; ARDUHAL_LOG_LEVEL_INFO
    ; ARDUHAL_LOG_LEVEL_DEBUG
    ; ARDUHAL_LOG_LEVEL_VERBOSE
